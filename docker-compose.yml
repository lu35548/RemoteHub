services:
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # 显式 IPv4：容器内 localhost 解析为 ::1，而 nginx 默认仅监听 IPv4 → 探测恒 refused
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=file:/data/prod.db
      # 备份目录指向独立卷（#38：与 sqlite-data 生命周期解耦——删库卷不连带备份）
      - BACKUP_DIR=/data/backups
      # 容器时区显式定死：node-cron 全部 4 个定时任务（备份 02:00 / session 03:00 / 审计 03:30 /
      # 通知清理 04:00）与备份文件名时间戳均按容器本地时区解释；不设 TZ 默认 UTC，本地时区语义整体偏移
      - TZ=Asia/Shanghai
    volumes:
      - sqlite-data:/data
      - backup-data:/data/backups
    healthcheck:
      # 显式 IPv4（与 frontend healthcheck 同口径）：容器内 localhost 解析 ::1，node fetch 对 ::1 探测
      # 恒 refused（IPv4 服务）；127.0.0.1 稳定。未炸是因 listen 无 host 绑定默认双栈——别依赖该巧合
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/v1/health').then(r => r.ok ? process.exit(0) : process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  sqlite-data:
  backup-data:
