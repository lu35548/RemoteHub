# RemoteHub frontend：SPA 托管 + /api 反代（upstream 用 compose 服务名，容器 DNS 解析）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 安全头不在此层加：backend helmet 已全套下发（CSP/HSTS/COOP 等），
    # nginx 再加会拼接出重复头（实测 x-frame-options 出现 "SAMEORIGIN, DENY"，Chrome 对重复值整头丢弃）

    # 带哈希的静态资源长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # /api 反代 backend 容器（四个 proxy_set_header 为 nginx 官方标准集）
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA history 路由 fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
