# RemoteHub frontend：SPA 托管 + /api 反代（upstream 用 compose 服务名，容器 DNS 解析）

# WS 反代用（票 #34）：Connection/Upgrade 是 hop-by-hop 头，nginx 默认不透传，必须显式转发。
# map 写法（nginx 官方 websocket.html「more sophisticated」形态）：客户端无 Upgrade 头时发
# Connection: close——/api/ 是 REST+WS 混合 location，固定 "upgrade" 会让普通 API 请求也带上
# upgrade 头，map 对混合流量安全。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # docker 内嵌 DNS（compose 服务名 → 容器 IP）。ipv6=off：只查 A 记录，避免 AAAA 空转。
    # 仅对变量化 proxy_pass 生效（静态 proxy_pass 启动时解析一次，resolver 不参与）
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    # 请求体硬顶（批 11 OQ #50 F1 挂账闭环）：backend 的 CL 预检只挡带 Content-Length 的
    # 请求，chunked 传输无 CL 头会读满 body 才 413（chunked 无 CL 敞口）——nginx 层按请求体
    # 实际字节数拦截，不依赖 CL 头，超限直接 413。50m 与 backend /api/v1/admin/import 的
    # 50mb 专属 parser limit 对齐（nginx 默认 1m 会先挡掉 import 合法大 body，须显式放宽）。
    client_max_body_size 50m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 安全头不在此层加：backend helmet 已全套下发（CSP/HSTS/COOP 等），
    # nginx 再加会拼接出重复头（实测 x-frame-options 出现 "SAMEORIGIN, DENY"，Chrome 对重复值整头丢弃）

    # 带哈希的静态资源长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA 入口禁缓存：每次向服务器校验，保证发版即生效
    # （`/` 经 index 指令内部重定向到 /index.html，同样命中本规则；票 #24 验收补）
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # /api 反代 backend 容器（四个 proxy_set_header 为 nginx 官方标准集）
    # #34 WS 三件套：proxy_http_version 1.1 显式写（不依赖部署环境 nginx >= 1.29.7 的新默认）；
    # Upgrade/Connection 透传使 /api/v1/ws upgrade 握手能建立隧道；
    # 30s 服务端心跳 < proxy_read_timeout 60s 默认，长连接保活无需调参。
    # upstream 变量化 + resolver（T10 遗留）：backend 容器重建换 IP 后经 docker DNS 重解析，
    # frontend 无需 restart（静态 proxy_pass 启动时解析一次，重建后即 502）
    location /api/ {
        set $backend_upstream http://backend:3001;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA history 路由 fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
